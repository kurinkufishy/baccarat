name = "baccarat-server"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "CASINO"
class_name = "Casino"

# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Casino"]

[vars]
FIREBASE_PROJECT_ID = "baccarat-66fbc"
# Pages that may connect (comma separated)
ALLOWED_ORIGINS = "https://kurinkufishy.github.io"
# Leave empty to let any Google account join, or list Gmail addresses (comma separated) to invite only them
ALLOWED_EMAILS = ""
ALLOW_LOCALHOST = "0"
