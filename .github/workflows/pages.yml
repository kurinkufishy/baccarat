name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp every script/style link with this commit so browsers never mix an old cached file with a new one.
      - name: Cache-bust
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from \"\./[a-z0-9-]+\.js)\"#\1?v=$V\"#g" web/*.js
          sed -i -E "s#(src=\"[a-z0-9-]+\.js)\"#\1?v=$V\"#g; s#(href=\"[a-z0-9-]+\.css)\"#\1?v=$V\"#g" web/*.html
          grep -ho 'v=[0-9a-f]*' web/*.js web/*.html | sort | uniq -c
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
